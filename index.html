            inputSchema: { type: "object", properties: {}, additionalProperties: false }
          },

                message: { type: "string", description: "Inquiry details" }
              },
              required: ["name", "email", "message"],
              additionalProperties: false
            }
          }
        ];
        var toolMap = new Map();
        tools.forEach(function(t) { toolMap.set(t.name, t); });

        function createShim(orig) {
          orig = orig || {};
          var shim = {
            tools: toolMap,
            getTools: function() { return Array.from(toolMap.values()); },
            getRegisteredTools: function() { return Array.from(toolMap.values()); },
            listTools: function() { return Array.from(toolMap.values()); },
            registerTool: function(t) {
              toolMap.set(t.name, t);
              if (typeof orig.registerTool === "function") {
                try { orig.registerTool(t); } catch (e) {}
              }
              return Promise.resolve(true);
            },
            unregisterTool: function(name) {
              toolMap.delete(name);
              if (typeof orig.unregisterTool === "function") {
                try { orig.unregisterTool(name); } catch (e) {}
              }
              return Promise.resolve(true);
            }
          };
          return shim;
        }

        var shim = createShim((typeof navigator !== "undefined" && navigator.modelContext) || (typeof document !== "undefined" ? document.modelContext : null));
        if (typeof navigator !== "undefined") {
          try {
            Object.defineProperty(navigator, 'modelContext', {
              value: shim,
              configurable: true,
              writable: true
            });
          } catch (e) {
            navigator.modelContext = shim;
          }
        }
        document.modelContext = shim;
        window.modelContext = shim;
        window.__WEBMCP_TOOLS__ = toolMap;
      })();
    </script>
