<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="ribbonFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ribbonBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg5)"/>
  <!-- Back Ribbon Fold -->
  <path d="M 150 120 L 150 270 C 150 350, 220 400, 290 380 C 350 360, 360 300, 360 260" fill="none" stroke="url(#ribbonBack)" stroke-width="52" stroke-linecap="round"/>
  <!-- Front Ribbon Overlap -->
  <path d="M 360 120 L 360 260 C 360 330, 310 392, 240 392 C 180 392, 150 340, 150 280" fill="none" stroke="url(#ribbonFront)" stroke-width="52" stroke-linecap="round"/>
</svg>