<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="teamsBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B83EB"/>
      <stop offset="100%" stop-color="#4F52B2"/>
    </linearGradient>
    <linearGradient id="teamsFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5FC7"/>
      <stop offset="100%" stop-color="#3B3A98"/>
    </linearGradient>
    <filter id="teamsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background canvas -->
  <rect width="512" height="512" rx="128" fill="#F8FAFC"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#E2E8F0" stroke-width="3"/>
  <!-- Back Tile (Connecting People / Strategy) -->
  <rect x="180" y="80" width="230" height="230" rx="52" fill="url(#teamsBack)"/>
  <!-- Back tile stylized B -->
  <text x="295" y="240" font-family="'Segoe UI', 'Outfit', sans-serif" font-size="140" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="0.85">B</text>
  <!-- Front Overlapping Tile (The U Monolith) with drop shadow -->
  <rect x="100" y="180" width="230" height="230" rx="52" fill="url(#teamsFront)" filter="url(#teamsShadow)"/>
  <!-- Front U form -->
  <path d="M166 230 V310 C166 350 190 366 215 366 C240 366 264 350 264 310 V230" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
</svg>